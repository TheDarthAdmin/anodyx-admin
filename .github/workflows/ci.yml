name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t anodyx-admin .

  # End-to-end against the real API needs the private main repo (TheDarthAdmin/anodyx).
  # Enable once a read-only deploy key or token for it is stored as ANODYX_REPO_TOKEN.
  e2e:
    if: ${{ vars.RUN_E2E == 'true' }}
    runs-on: ubuntu-latest
    needs: [web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: TheDarthAdmin/anodyx
          token: ${{ secrets.ANODYX_REPO_TOKEN }}
          path: anodyx
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cd anodyx/apps/api && uv sync --frozen --python 3.12
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          ANODYX_API_DIR: ${{ github.workspace }}/anodyx/apps/api
